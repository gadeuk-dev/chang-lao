<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut, interactive-widget=resizes-content">
<meta name="theme-color" content="#58CC02">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>창이랑 라오스어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&family=Noto+Sans+Lao+Looped:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --g:#58CC02;--gd:#46A302;--gl:#D7FFB8;
  --b:#1CB0F6;--bd:#1899D6;--bl:#DDF4FF;
  --r:#FF4B4B;--rd:#EA2B2B;--rl:#FFDFE0;
  --y:#FFC800;--yd:#E5A800;
  --p:#CE82FF;--pd:#A568CC;
  --line:#E5E5E5;--txt:#3C3C3C;--muted:#8A8A8A;--bg:#FFFFFF;--soft:#F7F7F7;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:"Noto Sans KR",system-ui,sans-serif}
.lo{font-family:"Noto Sans Lao Looped","Noto Sans Lao","Phetsarath OT","Saysettha OT",sans-serif}
h1,h2,h3,.jua{font-family:"Jua","Noto Sans KR",sans-serif;font-weight:400;margin:0}
button{font:inherit;cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 16px 96px}

/* 상단 바 */
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:2px solid var(--line);margin:0 -16px 16px;padding-left:16px;padding-right:16px}
.stat{display:flex;align-items:center;gap:4px;font-weight:900;font-size:17px}
.stat .ic{font-size:20px}
.s-streak{color:#FF9600}.s-coin{color:var(--yd)}.s-shield{color:var(--bd)}.s-debt{color:var(--rd)}

/* 하단 탭 */
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:520px;width:100%}
nav button{flex:1;background:none;border:none;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;font-weight:700}
nav button .ni{font-size:24px;filter:grayscale(1);opacity:.6;padding:2px 10px;border-radius:12px;border:2px solid transparent}
nav button.on{color:var(--b)}
nav button.on .ni{filter:none;opacity:1;background:var(--bl);border-color:#84D8FF}

/* 버튼 */
.btn{display:block;width:100%;border:none;border-radius:16px;padding:14px 16px;font-weight:900;font-size:16px;letter-spacing:.3px;color:#fff;background:var(--g);box-shadow:0 4px 0 var(--gd);transition:transform .05s;text-transform:uppercase}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.blue{background:var(--b);box-shadow:0 4px 0 var(--bd)}
.btn.red{background:var(--r);box-shadow:0 4px 0 var(--rd)}
.btn.yellow{background:var(--y);box-shadow:0 4px 0 var(--yd);color:#5a4300}
.btn.purple{background:var(--p);box-shadow:0 4px 0 var(--pd)}
.btn.ghost{background:#fff;color:var(--b);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn:disabled{background:var(--line);color:#AFAFAF;box-shadow:0 4px 0 #CFCFCF}
.btn.sm{padding:10px 12px;font-size:14px;border-radius:12px;width:auto;display:inline-block}
.row{display:flex;gap:10px}.row>*{flex:1}

.card{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;background:#fff}
.card h3{font-size:20px;margin-bottom:8px}
.muted{color:var(--muted);font-size:14px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted)}

/* 홈 */
.hero{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bubble{position:relative;flex:1;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.45}
.bubble:before{content:"";position:absolute;left:-10px;top:24px;border:8px solid transparent;border-right-color:var(--line)}
.bubble:after{content:"";position:absolute;left:-7px;top:24px;border:8px solid transparent;border-right-color:#fff}
.mascot{flex:none;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.task{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:2px solid var(--soft)}
.task:last-child{border-bottom:none}
.task .chk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--soft);flex:none}
.task.ok .chk{background:var(--g);color:#fff}
.task .t{flex:1;font-weight:700}
.bar{height:14px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--g);border-radius:999px;transition:width .3s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .d{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--soft);color:#BBB;position:relative}
.cal .d.done{background:#FFF0D6;color:#FF9600}
.cal .d.frozen{background:var(--bl);color:var(--bd)}
.cal .d.missed{background:var(--rl);color:var(--rd)}
.cal .d.today{outline:3px solid var(--b);outline-offset:-3px}
.cal .wk{font-size:11px;color:var(--muted);font-weight:700}
.debt{background:var(--rl);border-color:#FFB2B2}
.debt h3{color:var(--rd)}

/* 입력 */
label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
input,select,textarea{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--soft);color:var(--txt);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--b);background:#fff}
input.lo,textarea.lo{font-size:22px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 0;font-weight:700;color:var(--muted);box-shadow:0 3px 0 var(--line)}
.seg button.on{border-color:#84D8FF;background:var(--bl);color:var(--bd);box-shadow:0 3px 0 #84D8FF}

/* 단어 리스트 */
.w{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:2px solid var(--soft)}
.w .lo{font-size:22px;line-height:1.3}
.w .ko{font-size:15px;color:var(--muted)}
.w .grow{flex:1;min-width:0}
.w .note{font-size:13px;color:#AAA;margin-top:2px}
.lv{display:flex;gap:2px}.lv i{width:6px;height:14px;border-radius:3px;background:var(--line)}.lv i.f{background:var(--g)}
.chk-box{font-family:"Noto Sans KR","Noto Sans Lao Looped","Noto Sans Lao",sans-serif;margin-top:8px;padding:10px 12px;border-radius:12px;background:#FFF8E1;border:2px solid #FFE7A0;font-size:14px;line-height:1.6}
.chk-box.bad{background:var(--rl);border-color:#FFB2B2;color:#B32020}
.ai-row{font-family:"Noto Sans KR","Noto Sans Lao Looped","Noto Sans Lao",sans-serif;border:2px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;text-align:left}
.ai-row .lo{font-size:22px}
.ai-row .arrow{color:var(--muted);margin:0 6px}
.ai-row.fixme{border-color:#FFB2B2;background:#FFF5F5}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tap{cursor:pointer;border-radius:10px}
.tap:active{background:var(--soft)}
.pen{font-size:13px;opacity:.35}
.iconbtn{border:none;background:var(--soft);border-radius:10px;width:36px;height:36px;font-size:16px;flex:none}

/* 퀴즈 오버레이 */
.ov{position:fixed;inset:0;background:#fff;z-index:20;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.qtop{display:flex;align-items:center;gap:12px;padding:16px}
.qtop .x{border:none;background:none;font-size:26px;color:#AFAFAF;padding:0 4px}
.qtop .bar{flex:1;margin:0;height:16px}
.hearts{color:var(--r);font-weight:900;font-size:18px;white-space:nowrap}
.qbody{flex:1;padding:8px 16px;overflow:auto}
.qtype{font-family:"Jua";font-size:22px;margin:4px 0 18px}
.prompt{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.prompt .say{border:2px solid var(--line);border-radius:16px;padding:14px 18px;font-size:30px;line-height:1.4;flex:1}
.prompt .say.ko{font-size:24px;font-weight:700}
.spk{width:64px;height:64px;border-radius:16px;border:none;background:var(--b);box-shadow:0 4px 0 var(--bd);color:#fff;font-size:28px;flex:none}
.spk.big{width:110px;height:110px;font-size:48px;border-radius:24px;margin:10px auto 24px;display:block}
.choices{display:grid;gap:10px}
.ch{text-align:left;border:2px solid var(--line);border-radius:16px;background:#fff;padding:14px 16px;font-size:18px;box-shadow:0 4px 0 var(--line);display:flex;gap:12px;align-items:center;color:var(--txt)}
.ch .n{width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:13px;color:#AFAFAF;flex:none;font-weight:700}
.ch.lo{font-size:24px}
.ord-ans{min-height:70px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 12px;margin:0 0 18px;align-content:flex-start}
.ord-bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{font-size:22px;line-height:1.5;border:2px solid var(--line);border-radius:14px;background:#fff;padding:5px 14px;box-shadow:0 3px 0 var(--line);color:var(--txt)}
.tile.ph{background:var(--line);color:transparent;box-shadow:none}
.tile.right{border-color:var(--g);background:var(--gl);box-shadow:0 3px 0 var(--g)}
.tile.wrong{border-color:var(--r);background:var(--rl);box-shadow:0 3px 0 var(--r)}
.blank{display:inline-block;min-width:2.6em;border-bottom:3px solid var(--b);color:var(--bd);margin:0 3px;text-align:center}
.blank.right{color:var(--gd);border-color:var(--g)}
.blank.wrong{color:var(--rd);border-color:var(--r)}
.ord-hint{font-size:16px;font-weight:700;color:var(--muted);flex:1}
.ch.sel{border-color:#84D8FF;background:var(--bl);box-shadow:0 4px 0 #84D8FF;color:var(--bd)}
.ch.sel .n{border-color:#84D8FF;color:var(--bd)}
.ch.right{border-color:var(--g);background:var(--gl);box-shadow:0 4px 0 var(--g)}
.ch.wrong{border-color:var(--r);background:var(--rl);box-shadow:0 4px 0 var(--r)}
.qfoot{padding:16px;border-top:2px solid var(--line);padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.qfoot.ok{background:var(--gl);border-color:var(--gl)}
.qfoot.bad{background:var(--rl);border-color:var(--rl)}
.fb{font-family:"Jua";font-size:22px;margin-bottom:10px}
.qfoot.ok .fb{color:var(--gd)}.qfoot.bad .fb{color:var(--rd)}
.fb small{display:block;font-family:"Noto Sans KR";font-size:15px;font-weight:700;margin-top:4px}

/* 모달·토스트 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;padding:20px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.modal .box{background:#fff;border-radius:24px;padding:24px 20px 20px;max-width:380px;width:100%;text-align:center;animation:pop .25s ease-out;margin:auto}
.modal textarea{max-height:40vh}
.jbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.jbtns .btn{width:auto;padding:6px 12px}
.fbk{border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin-top:10px}
.fbk.ok{border-color:var(--g);background:#F4FCEB}
.fbk .txt{font-size:21px;line-height:1.6;margin:2px 0 4px;white-space:pre-wrap}
.lbl{font-size:13px;font-weight:700;color:var(--muted)}
.fix{border-top:1px dashed var(--line);padding:8px 0}
mark.bad{background:#FFDFE0;color:var(--rd);border-radius:4px;padding:0 2px}
mark.good{background:#D7FFB8;color:var(--gd);border-radius:4px;padding:0 2px}
.modal h2{font-size:26px;margin:8px 0}
.modal p{line-height:1.55;margin:8px 0 18px}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#3C3C3C;color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;z-index:50;font-size:14px;white-space:nowrap;animation:pop .2s}
.burst{position:fixed;font-size:26px;pointer-events:none;z-index:60;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
.big-num{font-family:"Jua";font-size:56px;color:#FF9600;line-height:1}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.statgrid div{border:2px solid var(--line);border-radius:14px;padding:10px 4px}
.statgrid b{display:block;font-size:20px}
.statgrid span{font-size:12px;color:var(--muted);font-weight:700}
.road li{margin:6px 0;line-height:1.5}
.road .now{color:var(--gd);font-weight:900}
</style>
</head>
<body>
<div id="app">
  <div class="top" id="top"></div>
  <main id="main"></main>
</div>
<nav><div class="in" id="nav"></div></nav>

<script>
/* ========== 기본 도구 ========== */
const KEY = 'chang_lao_v1';
const INTERVAL = [0, 1, 2, 4, 7, 15, 30];          // 숙련도 상자별 복습 간격(일)
const PENALTY_COIN = 15, PENALTY_DEBT = 5, DEBT_MAX = 30, SHIELD_PRICE = 50, SHIELD_MAX = 3;
const $ = s => document.querySelector(s);
const today = () => new Date().toLocaleDateString('sv-SE');
const addDays = (d, n) => { const t = new Date(d + 'T00:00:00'); t.setDate(t.getDate() + n); return t.toLocaleDateString('sv-SE'); };
const diffDays = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function defState() {
  return { words: [], goal: 5, streak: 0, best: 0, coins: 0, shields: 1, debt: 0,
           history: {}, lastCheck: null, journal: [], sound: true, pending: [] };
}
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) return Object.assign(defState(), s); } catch (e) {} return defState(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('저장 실패: 저장 공간을 확인해 주세요'); } if (window.cloudSoon) cloudSoon(); }
let S = load();
const H = (d = today()) => S.history[d] || (S.history[d] = { added: 0, quiz: false, done: false, wrote: false });

/* ========== 소리·발음 ========== */
let AC;
function beep(kind) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const notes = { ok: [660, 990], bad: [260, 200], win: [523, 659, 784, 1046] }[kind];
    notes.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + i * 0.09;
      o.type = 'triangle'; o.frequency.value = f; o.connect(g); g.connect(AC.destination);
      g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      o.start(t); o.stop(t + 0.22);
    });
  } catch (e) {}
}
let loVoice = null;
function findVoice() { try { loVoice = speechSynthesis.getVoices().find(v => /^lo/i.test(v.lang)) || null; } catch (e) {} }
if ('speechSynthesis' in window) { findVoice(); speechSynthesis.onvoiceschanged = () => { findVoice(); }; }
function speak(text) {
  if (!loVoice) { toast('이 기기엔 라오스어 음성이 없어요 (설정 탭 참고)'); return; }
  const u = new SpeechSynthesisUtterance(text); u.voice = loVoice; u.lang = loVoice.lang; u.rate = 0.85;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

/* ========== 철자 검사 1: 글자 순서 규칙 (인터넷 없이 즉시) ========== */
const RX = {
  mark: '[\\u0EB1\\u0EB4-\\u0EB9\\u0EBB\\u0EBC\\u0EC8-\\u0ECD]',     // 위·아래에 붙는 기호
  vowelMark: '[\\u0EB1\\u0EB4-\\u0EB9\\u0EBB\\u0ECD]',              // 위·아래 모음
  tone: '[\\u0EC8-\\u0ECB]',                                          // 성조 ່ ້ ໊ ໋
  cons: '[\\u0E81-\\u0EAE\\u0EDC-\\u0EDF]',                           // 자음
  lead: '[\\u0EC0-\\u0EC4]'                                           // 앞모음 ເ ແ ໂ ໃ ໄ
};
function checkLao(s) {
  const out = [], add = (level, msg, fix) => out.push({ level, msg, fix });
  if (!s.trim()) return out;
  if (/[฀-๿]/.test(s)) add('err', '태국 글자가 섞여 있어요. 라오스어 자판으로 바꿔 쓰세요');
  if (!/[຀-໿]/.test(s)) { add('err', '라오스 글자가 없어요. 자판이 라오스어인지 확인하세요'); return out; }
  if (/[A-Za-z]/.test(s)) add('warn', '영어 글자가 섞여 있어요');
  if (new RegExp('(^|[\\s.,!?])' + RX.mark).test(s)) add('err', '기호(모음·성조)로 시작할 수 없어요. 앞에 자음이 빠졌어요');
  if (/ເເ/.test(s)) add('err', 'ເ 두 개가 아니라 ແ 한 글자로 써야 해요', true);
  if (/ໍາ/.test(s)) add('err', 'ໍ + າ 가 아니라 ຳ 한 글자로 써야 해요', true);
  if (new RegExp(RX.tone + RX.vowelMark).test(s)) add('err', '성조 기호를 모음 기호보다 먼저 쳤어요 (보기엔 같아도 다른 글자로 저장돼요)', true);
  if (new RegExp(RX.tone + RX.tone).test(s)) add('err', '성조 기호가 두 개 붙었어요');
  if (/([ັິ-ູົຼ່-ໍ])\1/.test(s)) add('err', '같은 기호를 두 번 쳤어요', true);
  if (new RegExp(RX.vowelMark + RX.vowelMark).test(s)) add('warn', '모음 기호가 두 개 겹쳤어요. 맞는지 확인해 보세요');
  if (new RegExp(RX.lead + '(?!' + RX.cons + ')').test(s.replace(/ເເ/g, 'ແ'))) add('err', 'ເ ແ ໂ ໃ ໄ 뒤에는 자음이 와야 해요');
  if (/ຫ[ລນມ]|ຣ/.test(s)) add('info', '옛 표기(ຫລ·ຫນ·ຫມ·ຣ)가 있어요. 요즘은 ຫຼ·ໜ·ໝ·ລ로 많이 써요');
  return out;
}
function fixLao(s) {
  return s.replace(/ເເ/g, 'ແ').replace(/ໍາ/g, 'ຳ')
    .replace(new RegExp('(' + RX.tone + ')(' + RX.vowelMark + ')', 'g'), '$2$1')
    .replace(/([ັິ-ູົຼ່-ໍ])\1+/g, '$1');
}
function chkHtml(list, fixFn) {
  if (!list.length) return '';
  const ic = { err: '❌', warn: '⚠️', info: 'ℹ️' };
  return `<div class="chk-box ${list.some(x => x.level === 'err') ? 'bad' : ''}">${list.map(x => `<div>${ic[x.level]} ${x.msg}</div>`).join('')}
    ${list.some(x => x.fix) && fixFn ? `<button class="btn sm blue" style="margin-top:8px" onclick="${fixFn}">자동으로 고치기</button>` : ''}</div>`;
}
function liveCheck(inputId, boxId) {
  const inp = document.getElementById(inputId), box = document.getElementById(boxId);
  if (!inp || !box) return;
  const run = () => { box.innerHTML = chkHtml(checkLao(inp.value), `applyFix('${inputId}','${boxId}')`); };
  inp.addEventListener('input', run); run();
}
function applyFix(inputId, boxId) {
  const inp = document.getElementById(inputId); inp.value = fixLao(inp.value);

/* ========== 출석·패널티 판정 ========== */
function checkDays() {
  const t = today();
  if (!S.lastCheck) { S.lastCheck = t; save(); return; }
  if (S.lastCheck === t) return;
  const started = S.words.length > 0 || S.best > 0;
  for (let d = S.lastCheck; d < t; d = addDays(d, 1)) {
    const h = H(d);
    if (h.done || h.frozen || h.missed || !started) continue;
    if (S.shields > 0 && S.streak > 0) {
      S.shields--; h.frozen = true;
      S.pending.push({ type: 'frozen', d });
    } else {
      const lost = S.streak;
      S.streak = 0;
      S.coins = Math.max(0, S.coins - PENALTY_COIN);
      S.debt = Math.min(DEBT_MAX, S.debt + PENALTY_DEBT);
      h.missed = true;
      S.pending.push({ type: 'missed', d, lost });
    }
  }
  S.lastCheck = t;
  save();
}
function showPending() {
  if (!S.pending.length) return;
  const ev = S.pending; S.pending = []; save();
  const missed = ev.filter(e => e.type === 'missed'), frozen = ev.filter(e => e.type === 'frozen');
  if (missed.length) {
    const lost = Math.max(...missed.map(e => e.lost));
    modal(`${mascot('sad', 120)}<h2>창이가 기다렸어요…</h2>
      <p>${missed.length}일 동안 함께하지 못했어요.<br>
      ${frozen.length ? `☂️ 우산 ${frozen.length}개가 버텼지만 모자랐어요.<br>` : ''}
      ${lost ? `<b>🐾 연속 ${lost}일 기록이 끊겼어요.</b><br>` : ''}
      🍌 바나나 −${PENALTY_COIN * missed.length}<br>
      📚 <b>복습 빚 ${S.debt}문제</b>가 전체 복습 퀴즈에 더해져요.</p>`, '다시 시작할게요');
  } else if (frozen.length) {
    modal(`<div style="font-size:72px">☂️</div><h2>우산이 막아줬어요!</h2>
      <p>${frozen.length}일 빠졌지만 우산 ${frozen.length}개가 연속 기록을 지켰어요.<br>남은 우산: ${S.shields}개</p>`, '휴, 다행이다');
  }
}
function tryCompleteDay() {
  const h = H();
  if (h.done || h.added < S.goal || !h.quiz) return false;
  h.done = true;
  S.streak++; S.best = Math.max(S.best, S.streak);
  const bonus = 10 + Math.min(S.streak, 20);
  S.coins += bonus;
  let shieldMsg = '';
  if (S.streak % 7 === 0 && S.shields < SHIELD_MAX) { S.shields++; shieldMsg = '<br>☂️ 7일 달성! 우산 1개 선물'; }
  save();
  setTimeout(() => {
    beep('win'); burst('🍌');
    modal(`${mascot('proud', 130)}<div class="big-num">${S.streak}</div><h2>일째 함께 걸었어요!</h2>
      <p>오늘 할 일 끝! 🍌 +${bonus}${shieldMsg}<br><span class="muted">내일도 창이랑 놀아 주세요</span></p>`, '좋아요!');
  }, 350);
  return true;
}

/* 휴대폰 자판이 올라오면: 팝업·퀴즈 화면을 '보이는 영역'(자판 위)에 맞추고, 쓰는 줄이 자판에 안 가리게 */
function fitToKeyboard() {
  const vv = window.visualViewport; if (!vv) return;
  const kb = window.innerHeight - vv.height > 120;          // 자판이 떠 있음
  document.querySelectorAll('.modal, .ov').forEach(el => {
    if (kb) { el.style.top = vv.offsetTop + 'px'; el.style.height = vv.height + 'px'; el.style.bottom = 'auto'; }
    else { el.style.top = el.style.height = el.style.bottom = ''; }
  });
  if (kb) keepCaretVisible();
}
function keepCaretVisible() {
  const a = document.activeElement;
  if (!a || !/^(TEXTAREA|INPUT)$/.test(a.tagName)) return;
  const box = a.closest('.modal, .ov'); if (!box) return;
  if (a.tagName === 'TEXTAREA') { a.style.height = 'auto'; a.style.height = Math.min(a.scrollHeight + 2, innerHeight * .4) + 'px'; a.scrollTop = a.scrollHeight; }
  requestAnimationFrame(() => {
    const r = a.getBoundingClientRect(), vv = window.visualViewport, bottom = vv ? vv.offsetTop + vv.height : innerHeight;
    if (r.bottom > bottom - 12) box.scrollTop += r.bottom - bottom + 24;
    else if (r.top < (vv ? vv.offsetTop : 0) + 12) box.scrollTop -= (vv ? vv.offsetTop : 0) + 24 - r.top;
  });
}
if (window.visualViewport) { visualViewport.addEventListener('resize', fitToKeyboard); visualViewport.addEventListener('scroll', fitToKeyboard); }
document.addEventListener('input', e => { if (e.target.closest && e.target.closest('.modal, .ov')) keepCaretVisible(); });
document.addEventListener('focusin', e => { if (e.target.closest && e.target.closest('.modal, .ov')) setTimeout(() => { fitToKeyboard(); keepCaretVisible(); }, 300); });
function burst(ch) {
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('div'); s.className = 'burst'; s.textContent = ch;
    s.style.left = '50%'; s.style.top = '45%';
    s.style.setProperty('--dx', (Math.random() * 360 - 180) + 'px');
    s.style.setProperty('--dy', (Math.random() * -320 - 40) + 'px');
    s.style.setProperty('--rot', (Math.random() * 540 - 270) + 'deg');
    document.body.appendChild(s); setTimeout(() => s.remove(), 1200);
  }
}

function pushWord(lo, ko, kind, note) {
  lo = lo.trim(); ko = ko.trim();
  if (!lo || !ko) return 'empty';
  if (S.words.some(w => w.lo === lo)) return 'dup';
  const t = today();
  S.words.push({ id: uid(), lo, ko, kind, note: (note || '').trim(), created: t, box: 0, due: t, seen: 0, right: 0 });
  H().added++; S.coins += 1;
  return 'ok';
}
function addOne() {
  const lo = fixLao($('#fLo').value.trim());
  const errs = checkLao(lo).filter(x => x.level === 'err');
  if (errs.length && !confirm(`철자에 문제가 있어 보여요:\n\n${errs.map(x => '· ' + x.msg).join('\n')}\n\n그래도 넣을까요?`)) return;
  const r = pushWord(lo, $('#fKo').value, addKind, $('#fNote').value);
  if (r === 'empty') return toast('라오스어와 뜻을 모두 써 주세요');
  if (r === 'dup') return toast('이미 가르쳐 준 표현이에요');
  save(); beep('ok'); toast('🍌 +1 · 창이가 배웠어요!');
  const added = S.words[S.words.length - 1];
  tryCompleteDay();
  renderTop(); renderAdd(); $('#fLo') && $('#fLo').focus();
  aiReview([added], true);
}
function addBulk() {
  const lines = $('#bulkT').value.split('\n').map(l => l.trim()).filter(Boolean);
  let ok = 0, dup = 0, bad = 0; const flagged = [], added = [];
  for (const l of lines) {
    const m = l.split(/\s*(?:=|\t)\s*/);
    if (m.length < 2) { bad++; continue; }
    const lo = fixLao(m[0]);
    const r = pushWord(lo, m.slice(1).join(' '), addKind);
    if (r === 'ok') { ok++; added.push(S.words[S.words.length - 1]); if (checkLao(lo).some(x => x.level === 'err')) flagged.push(lo); }
    else r === 'dup' ? dup++ : bad++;

const AI_KEY = 'chang_lao_aikey', AI_MODEL_KEY = 'chang_lao_aimodel';          // 제미나이
const OA_KEY = 'chang_lao_oaikey', OA_MODEL_KEY = 'chang_lao_oamodel';         // 챗GPT(OpenAI) — 있으면 이쪽 우선

async function aiCheck(items) {
  const prompt = `You are a meticulous Lao (ພາສາລາວ) orthography checker for a Korean learner.
For each item, judge the Lao text against standard modern Lao spelling (as used in Laos today) and against the Korean meaning given.
Rules:
- Only flag real errors (wrong vowel, wrong consonant, missing/extra tone mark, wrong word). Do NOT "correct" text that is already correct.
- Accepted alternative spellings (e.g. older ຫລ/ຫນ/ຫມ instead of ຫຼ/ໜ/ໝ, or ຣ) are NOT errors: set ok=true, variant=true and give the modern form in suggestion.
- If the Lao is correctly spelled but does not mean the Korean, set ok=true, meaning_ok=false and explain in note_ko.
- suggestion: the corrected Lao text, or "" if nothing to change.
- note_ko: one short Korean sentence explaining what was wrong (Korean only), or "" if fine.
Items:
${items.map((w, i) => `${i}. lo="${w.lo.replace(/"/g, "'")}" ko="${w.ko.replace(/"/g, "'")}"`).join('\n')}`;
  return aiCall(prompt, { type: 'ARRAY', items: { type: 'OBJECT', properties: {
    i: { type: 'INTEGER' }, ok: { type: 'BOOLEAN' }, variant: { type: 'BOOLEAN' }, meaning_ok: { type: 'BOOLEAN' },
    suggestion: { type: 'STRING' }, note_ko: { type: 'STRING' } }, required: ['i', 'ok', 'variant', 'meaning_ok', 'suggestion', 'note_ko'] } });
}
// AI 호출 공통: JSON 틀(schema, 제미나이 형식으로 적음)대로 답을 받음. 챗GPT 키가 있으면 챗GPT로
async function aiCall(prompt, schema, temperature = 0) {

}
// 제미나이 형식 틀 → OpenAI 엄격 JSON 틀
function toOA(s) {
  const t = { type: s.type.toLowerCase() };
  if (s.properties) { t.properties = {}; for (const k in s.properties) t.properties[k] = toOA(s.properties[k]); t.required = Object.keys(s.properties); t.additionalProperties = false; }
  if (s.items) t.items = toOA(s.items);

}
async function oaCall(prompt, schema) {

  const models = [...new Set([lsGet(OA_MODEL_KEY), 'gpt-5.5', 'gpt-5.4', 'gpt-5.2', 'gpt-5', 'gpt-4.1'].filter(Boolean))];
  let last = '연결 실패';
  for (const model of models) {
    for (const reason of model.startsWith('gpt-5') ? [true, false] : [false]) {
      const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 90000);
      try {
        const body = { model, messages: [{ role: 'user', content: prompt }], response_format: { type: 'json_schema', json_schema: { name: 'answer', strict: true, schema: sch } } };
        if (reason) body.reasoning_effort = 'low';
        const r = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + oaKey() }, body: JSON.stringify(body), signal: ctl.signal });
        const j = await r.json().catch(() => ({}));
        if (r.ok) {
          try { localStorage.setItem(OA_MODEL_KEY, model); } catch (e) { }
          const o = JSON.parse(j.choices[0].message.content);
          return wrap ? o.items : o;
        }
        const code = (j.error && (j.error.code || j.error.type)) || '', msg = (j.error && j.error.message) || '';
        if (r.status === 401) throw new Error('챗GPT 키가 맞지 않아요');
        if (r.status === 429 && /quota|billing/i.test(code + msg)) throw new Error('OpenAI 크레딧이 없어요. platform.openai.com 결제(Billing)에서 충전해 주세요');
        if (r.status === 429) { last = '챗GPT가 지금 붐벼요. 잠시 뒤 다시 해 주세요'; break; }
        if (r.status === 400 && /reasoning/i.test(msg)) { last = msg; continue; }       // 이 모델은 생각 세기 옵션을 안 받음 → 빼고 다시
        if (r.status === 404 || /model/i.test(code + msg)) { last = '모델 없음: ' + model; break; }   // 다음 모델로
        last = `오류 ${r.status} ${msg.slice(0, 80)}`; break;
      } catch (e) {

        last = e.name === 'AbortError' ? '응답이 너무 늦어요. 잠시 뒤 다시 해 주세요' : (e.message || last);
        break;
      } finally { clearTimeout(timer); }
    }
  }
  throw new Error(last);
}
async function gmCall(prompt, schema, temperature) {
  const body = {
    contents: [{ role: 'user', parts: [{ text: prompt }] }],
    generationConfig: { temperature, responseMimeType: 'application/json', responseSchema: schema }
  };
  // 한 모델이 바쁘거나(503) 없어졌으면(404) 다음 모델로
  const models = [...new Set([aiModel(), 'gemini-3.8-flash', 'gemini-3.6-flash', 'gemini-3.5-flash', 'gemini-flash-latest'])];
  let last = '연결 실패';
  for (const model of models) {
    const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 45000);
    try {
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
        method: 'POST', headers: { 'content-type': 'application/json', 'x-goog-api-key': gmKey() }, body: JSON.stringify(body), signal: ctl.signal });
      const j = await r.json().catch(() => ({}));
      if (r.ok) { try { localStorage.setItem(AI_MODEL_KEY, model); } catch (e) {} return JSON.parse(j.candidates[0].content.parts[0].text); }
      if (r.status === 400 || r.status === 401 || r.status === 403) throw new Error('키가 맞지 않아요');
      if (r.status === 429) throw new Error('오늘 쓸 수 있는 양을 넘었어요');
      last = r.status === 503 ? '구글 AI가 지금 붐벼요. 잠시 뒤 다시 해 주세요' : `오류 ${r.status}`;
    } catch (e) {
      if (e.message === '키가 맞지 않아요' || e.message.startsWith('오늘')) throw e;
      last = e.name === 'AbortError' ? '응답이 너무 늦어요. 잠시 뒤 다시 해 주세요' : (e.message || last);
    } finally { clearTimeout(timer); }
  }
  throw new Error(last);
}

             <small>${Q.state === 'bad' ? `정답: <span class="lo">${esc(it.w.lo)}</span> = ${esc(it.w.ko)}` : `<span class="lo">${esc(it.w.lo)}</span> = ${esc(it.w.ko)}`}${it.w.note ? `<br><span style="font-weight:400">${esc(it.w.note)}</span>` : ''}</small></div>
           <button class="btn ${Q.state === 'bad' ? 'red' : ''}" onclick="nextQ()">계속</button>`}
    </div>`;
  if (it.type === 'listen' && Q.state === 'ask' && !it.played) { it.played = true; setTimeout(() => speak(it.w.lo), 250); }
}
function pick(k) { if (Q.state !== 'ask') return; Q.sel = k; renderQ(); }
function check() {
  const it = Q.items[Q.i], ans = it.type === 'k2l' ? it.w.lo : it.w.ko, t = today();
  const isOrd = it.type === 'order';
  const isBlank = it.type === 'blank';
  const ok = it.type === 'type' ? !it.gaveUp && !!normLao(it.typed) && normLao(it.typed) === normLao(it.w.lo)
    : isOrd
    ? it.ans.map(p => it.s.tiles[it.bank[p]]).join('') === it.s.tiles.join('')   // 같은 글자 블록은 어느 쪽이든 정답
    : isBlank ? it.choices[Q.sel] === it.b.ans
    : it.choices[Q.sel] === ans;
  const w = S.words.find(x => x.id === it.w.id);
  // 메모 예문 문제는 단어 숙련도에 안 넣음 (빈칸이 바로 그 단어일 때만 넣음)
  if (w && !it.retry && (isOrd ? it.s.own : isBlank ? (it.s.own || it.b.isWord) : true)) {               // 첫 시도 결과만 숙련도에 반영
    w.seen++;
    if (ok) { w.right++; w.box = Math.min(6, w.box + 1); w.due = addDays(t, INTERVAL[w.box]); }
    else { w.box = 0; w.due = addDays(t, 1); }
  }
  if (ok) { Q.state = 'ok'; Q.right += it.retry ? 0 : 1; Q.graded.add(Q.i); beep('ok'); }
  else {
    Q.state = 'bad'; Q.hearts--; beep('bad');
    if (!it.retry) { Q.graded.add(Q.i); Q.items.push({ w: it.w, type: it.type === 'listen' ? 'l2k' : it.type, s: it.s, b: it.b, retry: true }); Q.total++; }
    else Q.graded.add(Q.i);
  }
  save(); renderQ();
}
function nextQ() {
  if (Q.hearts <= 0) return endQuiz(false);
  Q.i++; Q.sel = null; Q.state = 'ask';
  if (Q.i >= Q.items.length) return endQuiz(true);
  renderQ();
}
function closeOv() { $('#ov') && $('#ov').remove(); document.body.style.overflow = ''; }
function quitQuiz() { if (confirm('그만둘까요? 지금까지 푼 건 저장되지만 이 퀴즈는 완료되지 않아요.')) { closeOv(); Q = null; render(); } }
function endQuiz(win) {
  const h = H(), first = Q.items.filter(x => !x.retry).length, acc = Math.round(Q.right / first * 100);
  closeOv();
  if (!win) {
    const m = Q.mode;
    modal(`${mascot('sad', 110)}<h2>하트를 다 썼어요</h2><p>${first}문제 중 ${Q.right}개 맞혔어요.<br>틀린 단어는 숙련도가 내려갔어요. 다시 도전해요!</p>`, '다시 풀기', () => startQuiz(m));
    Q = null; return;
  }
  const isAll = Q.mode === 'all', flag = isAll ? 'rquiz' : 'quiz';
  const wasDone = !!h[flag];
  let reward = 0;
  if (!wasDone) { h[flag] = true; reward = 5 + Q.right; S.coins += reward; }
  const paid = isAll && !wasDone ? S.debt : 0; if (paid) S.debt = 0;
  save(); beep('win'); burst('⭐');
  modal(`${mascot('proud', 110)}<h2>${isAll ? '전체 복습 완료!' : '오늘 단어 퀴즈 완료!'}</h2>
    <div class="statgrid"><div><b>${acc}%</b><span>정답률</span></div><div><b>❤️ ${Q.hearts}</b><span>남은 하트</span></div><div><b>🍌 ${reward}</b><span>보상</span></div></div>
    <p>${paid ? `📚 복습 빚 ${paid}문제를 다 갚았어요!<br>` : ''}${wasDone ? '오늘 이미 받은 퀴즈라 보상은 없어요 (연습).' : ''}${!isAll && !h.rquiz ? '<br>전체 복습 퀴즈도 풀면 바나나를 더 받아요.' : ''}</p>`, '계속', () => { tryCompleteDay(); render(); });
  Q = null;
}

// 예전 글엔 id가 없어서, 날짜+글로 만든 고정 id를 붙임(폰·컴퓨터에서 같은 id가 나오게)
function hashStr(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) >>> 0; return h.toString(36); }
function jid(j) { if (!j.id) j.id = 'j' + hashStr(j.date + '|' + j.text); return j.id; }
const jKey = jid;
function jBtn(ix) {
  const j = S.journal[ix]; if (!j) return;
  j.fb ? showCorrection(jid(j)) : correctWriting(jid(j));
}
// 키 없이: 챗GPT 앱/웹을 부탁 글이 채워진 채로 열기 (클립보드에도 복사)
function chatgptApp(id) {
  const j = S.journal.find(x => jid(x) === id); if (!j) return;

1) 틀린 철자(모음·자음·성조 부호)·문법·단어·어순만 최소한으로 고친 전체 글
2) 고친 곳마다: 원래 → 고친 것, 이유 한 줄(한국어)

ຫລ/ຫນ/ຫມ 같은 옛 표기는 틀린 게 아니야. 설명은 한국어로.
${j.ko ? `\n하려던 말(한국어): ${j.ko}\n` : ''}
내 글:
${j.text}`;
  try { navigator.clipboard && navigator.clipboard.writeText(p); } catch (e) { }

async function correctWriting(id) {
  const j = S.journal.find(x => jKey(x) === id);

  wait.innerHTML = `<div class="box">${mascot('happy', 90)}<h2><span class="spin">✏️</span> 창이가 첨삭하는 중…</h2><p class="muted">10~30초쯤 걸려요</p></div>`;
  document.body.appendChild(wait);
  const vocab = S.words.slice(-60).map(w => `${w.lo} = ${w.ko}`).join('\n');
  const prompt = `You are a warm but precise Lao (ພາສາລາວ) writing tutor for a Korean intermediate learner who lives in Laos.

- Fix only real problems: spelling (vowels, consonants, tone marks), grammar, wrong word, word order, unnatural phrasing. Keep the learner's meaning and keep edits minimal.
- Older spellings ຫລ/ຫນ/ຫມ (vs ຫຼ/ໜ/ໝ) are acceptable, not errors.
- corrected: the whole text with your minimal corrections (identical to the original if it is already correct).
- natural: how a Lao native would say the same thing naturally, or "" if corrected is already natural.
- meaning_ko: what the ORIGINAL text actually says, translated literally into Korean.
- fixes: one item per change. wrong = the learner's original fragment (copied exactly from the text), right = your corrected fragment (exactly as it appears in corrected), why_ko = one short, easy Korean sentence explaining why, ko = Korean meaning of the corrected fragment.

${vocab}
${j.ko ? `What the learner meant (Korean): ${j.ko}\n` : ''}Learner's text:
${j.text}`;
  try {

      corrected: { type: 'STRING' }, natural: { type: 'STRING' }, meaning_ko: { type: 'STRING' },
      fixes: { type: 'ARRAY', items: { type: 'OBJECT', properties: { wrong: { type: 'STRING' }, right: { type: 'STRING' }, why_ko: { type: 'STRING' }, ko: { type: 'STRING' } }, required: ['wrong', 'right', 'why_ko', 'ko'] } },

function markFixes(text, list, cls) {

  });
